name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Build container image
        run: docker build --tag savepinner-mcp:test .
      - name: Verify unprivileged runtime
        run: test "$(docker run --rm --entrypoint id savepinner-mcp:test -u)" != "0"
